name: rawrag_mobile
description: A Flutter mobile app for RawRAG - Chat with any website using AI

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Markdown Rendering
  flutter_markdown: ^0.6.18
  
  # URL Launcher
  url_launcher: ^6.2.4
  
  # WebView (for graph visualization)
  webview_flutter: ^4.5.0
  
  # Speech/Voice (optional)
  flutter_tts: ^4.0.2
  
  # Loading indicators
  flutter_spinkit: ^5.2.0
  
  # Confetti animation
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
